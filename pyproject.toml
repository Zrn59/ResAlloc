[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "resalloc"
version = "0.2.4"
description = "Run one Python job across GPU providers and move it before the budget runs out."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["gpu", "training", "runpod", "modal", "kaggle", "vast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
modal = ["modal>=0.64"]
kaggle = ["kaggle>=1.6"]
all = ["modal>=0.64", "kaggle>=1.6"]
dev = ["pytest>=8"]

[project.scripts]
resalloc = "resalloc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resalloc = ["*.service", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
